<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{--bg:#0b0e14;--ac:#00ffcc;--tx:#eef2f7;--mut:#8d97a8;--red:#ff6b7a;--r:18px;--line:rgba(255,255,255,.09);--blur:blur(22px) saturate(1.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
body:before,body:after{content:"";position:fixed;z-index:-1;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.33;pointer-events:none;animation:fl 18s ease-in-out infinite alternate}
body:before{left:-25vmax;top:-20vmax;background:radial-gradient(circle,#00ffcc,transparent 65%)}
body:after{right:-30vmax;bottom:-25vmax;background:radial-gradient(circle,#5b6cff,transparent 65%);animation-delay:-9s}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.12)}}
.gl,header,nav,.card,#toast,.panel,select,input[type=text],input[type=password],input[type=number],textarea,.btn{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
header{position:sticky;top:8px;z-index:5;display:flex;gap:8px;padding:8px;margin:8px 12px 4px;border-radius:20px;background:rgba(22,27,38,.55);border:1px solid var(--line);box-shadow:0 12px 30px #0006,inset 0 1px 0 #ffffff14}
select,input[type=text],input[type=password],input[type=number],textarea{width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font:inherit;outline:0;transition:border .2s,box-shadow .2s,background .2s;box-shadow:inset 0 2px 6px #0004}
select option{background:#1b212c}
select:focus,input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #00ffcc22,inset 0 2px 6px #0004;background:rgba(255,255,255,.09)}
main{padding:6px 12px;animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
@media(min-width:640px){.bento{grid-template-columns:repeat(4,1fr)}main{max-width:820px;margin:auto}}
.card,.panel{background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 70%);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;box-shadow:0 16px 36px #0006,0 2px 6px #0004,inset 0 1px 0 #ffffff1c;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px);box-shadow:0 22px 44px #0007,0 2px 6px #0004,inset 0 1px 0 #ffffff24}
.s2{grid-column:span 2}.s4{grid-column:1/-1}
.big{font-size:26px;font-weight:700;color:var(--ac);line-height:1.1;text-shadow:0 0 18px #00ffcc55}.mut{color:var(--mut);font-size:12px}
h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}.row+.row{border-top:1px solid #ffffff0d}
.btn{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.08);color:var(--tx);font:600 13px system-ui;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s;white-space:nowrap;box-shadow:0 6px 16px #0004,inset 0 1px 0 #ffffff1a}
.btn:hover{background:rgba(255,255,255,.13)}.btn:active{transform:scale(.95)}
.btn.pri,.btn.on{background:linear-gradient(135deg,#00ffcc,#38d9ff);color:#04231c;border-color:transparent;box-shadow:0 8px 22px #00ffcc40,inset 0 1px 0 #fff6}
.btn.red{color:var(--red)}.btn.sm{padding:6px 10px;font-size:12px;border-radius:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sw{position:relative;width:46px;height:27px;flex:none}.sw input{display:none}.sw i{position:absolute;inset:0;background:rgba(255,255,255,.14);border-radius:20px;transition:.25s;box-shadow:inset 0 2px 5px #0006}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 3px 8px #0006}
.sw input:checked+i{background:linear-gradient(135deg,#00ffcc,#38d9ff)}.sw input:checked+i:after{left:22px}
input[type=range]{width:100%;accent-color:var(--ac);margin:6px 0 0}
.bars{display:flex;align-items:flex-end;gap:6px;height:64px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.bars b{width:100%;background:linear-gradient(180deg,#00ffcc,#38d9ff88);border-radius:6px 6px 2px 2px;min-height:3px;transition:height .5s;box-shadow:0 0 14px #00ffcc40}.bars span{font-size:9px;color:var(--mut)}
.pb{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:4px 0 8px;box-shadow:inset 0 1px 3px #0006}.pb b{display:block;height:100%;background:linear-gradient(90deg,#00ffcc,#38d9ff)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:2px;padding:6px;background:rgba(22,27,38,.6);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 40px #0008,inset 0 1px 0 #ffffff1c;z-index:6;max-width:640px;margin:auto}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:7px 0;font:600 10px system-ui;border-radius:18px;transition:.25s}nav button span{display:block;font-size:18px}
nav button.on{color:var(--ac);background:rgba(0,255,204,.12);box-shadow:inset 0 1px 0 #ffffff18,0 4px 14px #00ffcc22}
.item{display:flex;gap:8px;align-items:center;padding:8px 0}.item+.item{border-top:1px solid #ffffff0d}.item .t{flex:1;min-width:0}.item .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.08);font-size:11px;color:var(--mut)}.tag.ok{color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:rgba(0,255,204,.85);color:#04231c;font-weight:700;padding:9px 18px;border-radius:22px;opacity:0;transition:.25s;pointer-events:none;z-index:20;box-shadow:0 10px 26px #0006}#toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:15;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,8,14,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fd .2s}
.sheet .panel{width:100%;max-width:560px;margin:0 8px calc(8px + env(safe-area-inset-bottom));background:rgba(28,34,48,.72);-webkit-backdrop-filter:blur(34px) saturate(1.6);backdrop-filter:blur(34px) saturate(1.6);animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes fd{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
.center{text-align:center;padding:30px 14px}.center .big{font-size:20px;color:var(--tx);margin-bottom:8px;text-shadow:none}label.l{display:block;margin:8px 0 4px;color:var(--mut);font-size:12px}
.g{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1.4fr 1fr 1fr}
details summary{cursor:pointer;color:var(--mut);font-size:12px;padding:4px 0}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){header,nav,.card,.panel{background:#1b212c}}
</style></head>
<body>
<header id="hd" hidden><select id="chat"></select><button class="btn pri" id="sv" onclick="saveNow()">💾 Save</button></header>
<main id="m"><div class="center mut">Loading…</div></main>
<nav id="nv" hidden></nav><div id="toast"></div><div id="sh" class="sheet" hidden onclick="if(event.target==this)vClose()"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();try{tg.setHeaderColor('#0b0e14');tg.setBackgroundColor('#0b0e14')}catch(e){}
const $=s=>document.querySelector(s),ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={},cur=null,tab='home',tm,D={},live=false,hist=[],hfav=false,lt;
const hdr=()=>tg.initData?{'X-Init':tg.initData}:(ls('vb_t')?{'X-Token':ls('vb_t')}:{});
async function api(p,b,raw){const o={headers:{...hdr(),'Content-Type':'application/json'}};if(b!==undefined){o.method='POST';o.body=JSON.stringify(b)}
  const r=await fetch(p,o);if(!r.ok){const e=new Error((await r.text())||r.status);e.status=r.status;throw e}return raw?r:r.json()}
function toast(t,bad){const e=$('#toast');e.textContent=t||'Saved ✓';e.style.background=bad?'var(--red)':'';e.classList.add('on');clearTimeout(lt);lt=setTimeout(()=>e.classList.remove('on'),1400)}
const C=()=>(S.chats||[]).find(c=>c.id==cur);
const TABS=[['home','📊','Home'],['targets','🎯','Targets'],['voice','🎙','Voice'],['hist','🕘','History'],['more','⚙️','More']];

async function load(keep){
  try{S=await api('/api/state')}catch(e){
    if(!tg.initData&&(e.status==401||e.status==403)){return loginView()}
    return $('#m').innerHTML='<div class="center"><div class="big">Access error</div><div class="mut">Panel ta bot er private chat theke kholo.</div></div>'}
  if(S.role!=='owner'&&S.role!=='admin')return accessView();
  $('#hd').hidden=$('#nv').hidden=false;
  if(!C())cur=S.chats[0]?.id;
  $('#chat').innerHTML=(S.chats||[]).map(c=>`<option value="${c.id}" ${c.id==cur?'selected':''}>${esc(c.title||c.id)}</option>`).join('');
  render()}
function loginView(){$('#hd').hidden=$('#nv').hidden=true;$('#m').innerHTML=`<div class="card" style="margin-top:40px"><div class="big" style="color:var(--tx);font-size:20px">🔐 Panel Login</div><div class="mut">Approved admin username/password. Telegram e khulle auto login hoy.</div>
  <label class="l">Username</label><input type="text" id="lu" autocomplete="username"><label class="l">Password</label><input type="password" id="lp" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"><br><br><button class="btn pri" style="width:100%" onclick="doLogin()">Login</button></div>`}
async function doLogin(){try{const r=await api('/api/login',{username:$('#lu').value,password:$('#lp').value});ls('vb_t',r.token);load()}catch(e){toast(e.message||'Login failed',1)}}
function accessView(){$('#hd').hidden=$('#nv').hidden=true;const p=S.role=='pending';$('#m').innerHTML=`<div class="card center" style="margin-top:40px"><div class="big">${p?'⏳ Approval pending':'🔒 Access needed'}</div>
  <div class="mut">${p?'Owner approve korle panel khulbe. Approve holei bot message dibe.':'Ei panel shudhu owner-approved admin der jonno. Request pathale owner notification pabe.'}</div><br>
  ${tg.initData&&!p?'<button class="btn pri" onclick="reqAccess()">Request admin access</button>':''}${p?'<button class="btn" onclick="load()">↻ Check again</button>':''}${!tg.initData?'<button class="btn" onclick="ls(\'vb_t\',null);load()">Logout</button>':''}</div>`}
async function reqAccess(){try{await api('/api/request',{});toast('Request sent ✓');load()}catch(e){toast('Failed',1)}}

function render(){
  $('#nv').innerHTML=TABS.map(([k,i,n])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()"><span>${i}</span>${n}</button>`).join('');
  const c=C();if(!c){$('#m').innerHTML='<div class="center"><div class="big">Kono group nai</div><div class="mut">Bot ke group e add koro, group e ekta msg pathao, tarpor ekhane ashbe. (Tumi oi group er approved admin hote hobe)</div></div>'+(tab=='more'?V.more():'');return}
  $('#m').innerHTML=V[tab]();if(tab=='hist')loadHist()}
$('#chat').onchange=async e=>{await saveNow();cur=e.target.value;render()};

function set(k,v,re){C().s[k]=v;mark(k);if(re)render()}
function mark(k){(D[cur]=D[cur]||{})[k]=1;$('#sv').textContent='● Unsaved';clearTimeout(tm);tm=setTimeout(saveNow,700)}
async function saveNow(){clearTimeout(tm);const id=cur,c=C(),ks=Object.keys(D[id]||{});if(!c||!ks.length)return;D[id]={};
  try{await api('/api/save',{chat_id:id,patch:Object.fromEntries(ks.map(k=>[k,c.s[k]]))});$('#sv').textContent='💾 Save';toast()}catch(e){ks.forEach(k=>D[id][k]=1);$('#sv').textContent='● Unsaved';toast('Save failed',1)}}
const ask=(m,f)=>tg.initData&&tg.showConfirm?tg.showConfirm(m,ok=>ok&&f()):confirm(m)&&f();
const tog=(k,l)=>`<div class="row"><span>${l}</span><label class="sw"><input type="checkbox" ${C().s[k]?'checked':''} onchange="set('${k}',this.checked)"><i></i></label></div>`;
const sld=(k,l,a,b,u='')=>`<div style="padding:6px 0"><div class="row" style="padding:0"><span>${l}</span><b id="v_${k}" style="color:var(--ac)">${C().s[k]}${u}</b></div><input type="range" min="${a}" max="${b}" value="${C().s[k]}" oninput="$('#v_${k}').textContent=this.value+'${u}'" onchange="set('${k}',+this.value);autoPrev()"></div>`;
const sel=(k,l,o)=>`<div class="row"><span>${l}</span><select style="width:58%" onchange="set('${k}',this.value,${k=='provider'||k=='lang'});autoPrev()">${o.map(([v,t])=>`<option value="${esc(v)}" ${C().s[k]==v?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
const vname=v=>v.split('-').slice(2).join(' ').replace('Neural','')+' ('+v.slice(0,5)+')';

const V={
home(){const c=C(),st=c.stats,mx=Math.max(1,...st.daily.map(d=>d[1])),tp=Object.values(st.prov).reduce((a,b)=>a+b,0)||1;
 return `<div class="bento">
 <div class="card"><div class="big">${st.voices}</div><div class="mut">Voices</div></div>
 <div class="card"><div class="big">${st.chars>9999?(st.chars/1000).toFixed(1)+'k':st.chars}</div><div class="mut">Characters</div></div>
 <div class="card s2"><div class="row" style="padding:0"><div><b>Bot status</b><div class="mut">${c.pending} queued</div></div><label class="sw"><input type="checkbox" ${c.s.enabled?'checked':''} onchange="set('enabled',this.checked)"><i></i></label></div></div>
 <div class="card s2"><h4>Last 7 days</h4><div class="bars">${st.daily.length?st.daily.map(d=>`<div><b style="height:${Math.max(4,d[1]/mx*100)}%"></b><span>${d[0].slice(8)}</span></div>`).join(''):'<span class="mut">No data yet</span>'}</div></div>
 <div class="card s2"><h4>Providers used</h4>${Object.entries(st.prov).map(([k,n])=>`<div class="mut" style="display:flex;justify-content:space-between"><span>${esc(k)}</span><span>${n}</span></div><div class="pb"><b style="width:${n/tp*100}%"></b></div>`).join('')||'<span class="mut">No data yet</span>'}</div>
 <div class="card s2"><h4>API keys (server env)</h4><div class="chips"><span class="tag ${S.keys.cartesia?'ok':''}">Cartesia ${S.keys.cartesia?'✓':'✗'}</span><span class="tag ${S.keys.elevenlabs?'ok':''}">ElevenLabs ${S.keys.elevenlabs?'✓':'✗'}</span><span class="tag ok">Edge ✓</span><span class="tag ${S.backup?'ok':''}">Backup ${S.backup?'✓':'✗'}</span></div></div>
 <button class="btn pri" onclick="act('send')">▶ Send now</button><button class="btn" onclick="act('clear')">🗑 Clear queue</button></div>
 <button class="btn s4" style="width:100%" onclick="load()">↻ Refresh</button>`},
targets(){const c=C();return `<div class="bento"><div class="card s4"><h4>Voice reply korbe ei usernames ke</h4>
 ${tog('only_listed','Only listed usernames')}${sld('default_timer','Default wait',1,120,'s')}</div>
 <div class="card s4"><h4>Target usernames (wait time)</h4>${Object.entries(c.s.timers).map(([n,t])=>`<div class="item"><b class="t">@${esc(n)}</b><input type="number" min="1" style="width:76px" value="${t}" data-n="${esc(n)}" onchange="setT(this.dataset.n,this.value)"><button class="btn sm red" data-n="${esc(n)}" onclick="delT(this.dataset.n)">✕</button></div>`).join('')||'<div class="mut">Kono target nai</div>'}
 <div class="item"><input type="text" id="nu" class="t" placeholder="@username"><input type="number" id="ns" style="width:76px" value="15" min="1"><button class="btn sm pri" onclick="addT()">＋</button></div></div>
 <div class="card s4"><h4>Ignore list (comma separated)</h4><textarea rows="2" onchange="set('ignore',this.value.split(',').map(x=>x.trim().replace(/^@/,'')).filter(Boolean))">${esc(c.s.ignore.join(', '))}</textarea></div></div>`},
voice(){const c=C(),s=c.s,P={normal:'Normal',deep:'Deep',robot:'Robot',child:'Child',deep_robot:'Deep Robot'},ids=[['cartesia','bn','Cartesia Bangla'],['cartesia','en','Cartesia English'],['elevenlabs','bn','ElevenLabs Bangla'],['elevenlabs','en','ElevenLabs English']];
 return `<div class="bento"><div class="card s4"><h4>Engine</h4>${sel('provider','Provider',S.providers.map(p=>[p,{both:'Cartesia → ElevenLabs (no Edge fallback)',cartesia:'Cartesia',elevenlabs:'ElevenLabs',edge:'Edge TTS'}[p]]))}
 ${sel('lang','Language',[['auto','Auto detect'],['bn','Bangla'],['en','English']])}</div>
 <div class="card s4"><h4>Voice style</h4><div class="chips">${S.presets.map(p=>`<button class="btn sm ${s.preset==p?'on':''}" onclick="set('preset','${p}',1);autoPrev()">${P[p]||p}</button>`).join('')}</div>
 ${tog('preset_edge','Style use Edge TTS (real pitch control)')}<div class="mut">Deep/Robot/Child presets may not apply identical pitch effects on every API provider. Select Edge explicitly only when you want Edge TTS.</div></div>
 <div class="card s4"><h4>Tuning</h4>${sld('rate','Speed',-50,100,'%')}${sld('pitch','Pitch (Edge)',-50,50,'Hz')}${sld('volume','Volume',-50,50,'%')}
 <div class="row"><span>Live preview on change</span><label class="sw"><input type="checkbox" ${live?'checked':''} onchange="live=this.checked"><i></i></label></div>
 <input type="text" id="pt" value="Ei ta ekta test voice. This is a test."><br><br><button class="btn pri" style="width:100%" onclick="prev()">🔊 Preview</button></div>
 <div class="card s4"><div class="row" style="padding:0"><h4 style="margin:0">Voice library</h4><button class="btn sm pri" onclick="vSheet()">＋ Add voice</button></div><div class="mut" style="margin:4px 0 6px">Shared by all groups and /voices. “Use” applies to: <b>${esc(c.title||'Global')}</b></div>
 ${(S.voice_lib||[]).map(v=>{const on=s[v.prov+'_voice_'+v.lang]==v.id;return `<div class="item"><div class="t"><div><b>${esc(v.name)}</b> ${on?'<span class="tag ok">active</span>':''}</div><div class="mut">${v.prov} · ${v.lang} · ${esc(v.id.slice(0,12))}…</div></div><button class="btn sm ${on?'on':''}" onclick="useV('${v.k}')">Use</button><button class="btn sm" onclick="vSheet('${v.k}')">✎</button><button class="btn sm red" onclick="delV('${v.k}')">✕</button></div>`}).join('')||'<div class="mut">Library is empty</div>'}
 <details><summary>Direct voice ID fields</summary>${ids.map(([p,l,n])=>`<label class="l">${n}</label><input type="text" value="${esc(s[p+'_voice_'+l]||'')}" placeholder="voice ID" onchange="set('${p}_voice_${l}',this.value.trim())">`).join('')}</details></div>
 <div class="card s4"><h4>Edge voices</h4>${sel('voice_bn','Bangla',S.voices.bn.map(v=>[v,vname(v)]))}${sel('voice_en','English',S.voices.en.map(v=>[v,vname(v)]))}</div></div>`},
hist(){return `<div class="bento"><div class="card s4"><div class="chips"><button class="btn sm ${hfav?'':'on'}" onclick="hfav=false;render()">All</button><button class="btn sm ${hfav?'on':''}" onclick="hfav=true;render()">⭐ Favorites</button></div><div id="hl" style="margin-top:6px"><div class="mut">Loading…</div></div></div></div>`},
more(){const c=C(),own=S.role=='owner';return `<div class="bento">${c?`<div class="card s4"><h4>Filters</h4>${tog('read_names','Sender er naam pora')}${tog('strip_links','Link → "link"')}${tog('strip_emoji','Emoji bad deya')}${tog('caption','Voice er sathe text caption')}${tog('reply','Sender er msg e reply hishebe')}${sld('min_chars','Minimum characters',1,100)}${sld('max_chars','Max characters per voice',200,20000)}</div>`:''}
 ${c&&cur!='__global__'?`<div class="card s4"><button class="btn red" style="width:100%" onclick="resetChat()">↺ Reset this group to global defaults</button></div>`:''}
 <div class="card s4"><h4>Browser login (username / password)</h4><div class="mut">${S.login?'Current username: <b>'+esc(S.login)+'</b>':'Set kora nai'}</div><div class="g g2"><input type="text" id="au" placeholder="username" value="${esc(S.login)}"><input type="password" id="ap" placeholder="password (min 8)"></div><br><div class="g g2"><button class="btn pri" onclick="setCreds()">Save login</button>${!tg.initData?'<button class="btn red" onclick="ls(\'vb_t\',null);load()">Logout</button>':'<span></span>'}</div></div>
 ${own?`<div class="card s4"><h4>Admin approvals</h4>${(S.requests||[]).map(r=>`<div class="item"><div class="t"><div><b>${esc(r.name)}</b> @${esc(r.username)}</div><div class="mut">ID ${r.uid}</div></div><button class="btn sm pri" onclick="adm('approve',${r.uid})">Approve</button><button class="btn sm red" onclick="adm('deny',${r.uid})">Deny</button></div>`).join('')||'<div class="mut">Pending request nai</div>'}
 <h4 style="margin-top:12px">Approved admins</h4>${(S.admins||[]).map(r=>`<div class="item"><div class="t"><div><b>${esc(r.name)}</b> @${esc(r.username)}</div><div class="mut">ID ${r.uid}</div></div><button class="btn sm red" onclick="adm('remove',${r.uid})">Remove</button></div>`).join('')||'<div class="mut">Kono admin nai</div>'}</div>`:''}</div>`}
};
function setT(n,v){C().s.timers[n]=Math.max(1,+v||1);mark('timers')}
function delT(n){delete C().s.timers[n];mark('timers');render()}
function addT(){const n=$('#nu').value.trim().toLowerCase().replace(/^@/,'');if(!n)return;C().s.timers[n]=Math.max(1,+$('#ns').value||15);mark('timers');render()}
const VK=k=>(S.voice_lib||[]).find(v=>v.k==k);
function vSheet(k){const v=VK(k)||{};$('#sh').innerHTML=`<div class="panel"><h4>${k?'Edit voice':'Add voice'}</h4><div class="g"><input type="text" id="vn" placeholder="Name" maxlength="30" value="${esc(v.name||'')}"><input type="text" id="vi" placeholder="Voice ID" value="${esc(v.id||'')}"><div class="g g2"><select id="vp"><option ${v.prov=='cartesia'?'selected':''}>cartesia</option><option ${v.prov=='elevenlabs'?'selected':''}>elevenlabs</option></select><select id="vl"><option value="bn" ${v.lang=='bn'?'selected':''}>Bangla</option><option value="en" ${v.lang=='en'?'selected':''}>English</option></select></div></div><br><div class="g g2"><button class="btn" onclick="vClose()">Cancel</button><button class="btn pri" onclick="vSave('${k||''}')">Save</button></div></div>`;$('#sh').hidden=false}
function vClose(){$('#sh').hidden=true}
async function vSave(k){const voice={name:$('#vn').value.trim(),id:$('#vi').value.trim(),prov:$('#vp').value,lang:$('#vl').value};
  if(!voice.name||!/^[\w-]{6,80}$/.test(voice.id))return toast('Name + valid voice ID dao',1);
  try{const r=await api('/api/voice',{action:k?'edit':'add',k,voice});S.voice_lib=r.voice_lib;vClose();
    if(k)await load();else{const n=r.voice_lib.find(x=>x.name.toLowerCase()==voice.name.toLowerCase());if(n){const f=n.prov+'_voice_'+n.lang;C().s[f]=n.id;mark(f)}render()}
    toast('Voice saved ✓')}catch(e){toast((e.message||'Failed').slice(0,70),1)}}
function useV(k){const v=VK(k);if(!v)return;const f=v.prov+'_voice_'+v.lang;C().s[f]=v.id;mark(f);render();autoPrev()}
function delV(k){ask('Delete this voice?',async()=>{try{const r=await api('/api/voice',{action:'delete',k});S.voice_lib=r.voice_lib;await load();toast('Deleted ✓')}catch(e){toast('Delete failed',1)}})}
function resetChat(){ask('Reset this group to global defaults?',async()=>{try{await api('/api/save',{chat_id:cur,reset:true});D[cur]={};await load();toast('Reset ✓')}catch(e){toast('Failed',1)}})}
async function act(a){try{await api('/api/action',{chat_id:cur,action:a});toast('Done ✓');setTimeout(()=>load(),700)}catch(e){toast('Error',1)}}
async function play(url,body){const r=await api(url,body,1);const b=await r.blob();const a=new Audio(URL.createObjectURL(b));a.play();return r}
async function prev(){toast('Generating…');try{const r=await play('/api/preview',{s:C().s,text:$('#pt').value});toast('Played · '+(r.headers.get('X-TTS-Provider')||''))}catch(e){toast('Preview failed',1)}}
let pt;function autoPrev(){if(live&&tab=='voice'){clearTimeout(pt);pt=setTimeout(prev,800)}}
async function loadHist(){try{const r=await api(`/api/history?chat_id=${cur}${hfav?'&fav=1':''}`);hist=r.items;
  $('#hl').innerHTML=hist.map(h=>`<div class="item"><div class="t"><div>${esc(h.text)}</div><div class="mut">${new Date(h.ts*1000).toLocaleString([],{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})} · ${esc(h.prov)} · ${esc(h.preset)}${h.target?' · @'+esc(h.target):''}</div></div>
  <button class="btn sm" onclick="hPlay(${h.id})">▶</button><button class="btn sm ${h.fav?'on':''}" onclick="hFav(${h.id},${!h.fav})">★</button><button class="btn sm" onclick="hSend(${h.id})">↗</button><button class="btn sm red" onclick="hDel(${h.id})">✕</button></div>`).join('')||'<div class="mut">Kichu nai</div>'}catch(e){$('#hl').innerHTML='<div class="mut">Load hoyni</div>'}}
async function hPlay(id){try{const r=await api('/api/histaudio?id='+id,undefined,1);new Audio(URL.createObjectURL(await r.blob())).play()}catch(e){toast('Play failed',1)}}
async function hFav(id,f){await api('/api/hist',{action:'fav',id,fav:f});loadHist()}
async function hSend(id){try{await api('/api/hist',{action:'send',id,chat_id:cur});toast('Sent ✓')}catch(e){toast('Send failed',1)}}
async function hDel(id){await api('/api/hist',{action:'del',id});loadHist()}
async function setCreds(){try{await api('/api/creds',{username:$('#au').value,password:$('#ap').value});toast('Login saved ✓');$('#ap').value='';load()}catch(e){toast(e.message.slice(0,60),1)}}
async function adm(a,uid){try{await api('/api/admin',{action:a,uid});toast('Done ✓');load()}catch(e){toast('Error',1)}}
load();
</script></body></html>
