input:focus,textarea:focus,select:focus{outline:0;box-shadow:var(--glow)}
.sw i,.sw i:after{transition:background .25s var(--ease),transform .25s var(--ease)}
.pb b,.bars b{transition:width .5s var(--ease),height .5s var(--ease)}
.item{transition:background .2s}

<body>

<nav id="nv" hidden></nav><div id="toast"></div><div id="sh" class="sheet" hidden onclick="if(event.target==this)vClose()"></div>
<script>
const tg=(window.Telegram&&Telegram.WebApp)||{initData:'',ready(){},expand(){}};tg.ready();tg.expand();try{tg.setHeaderColor('#000000');tg.setBackgroundColor('#000000');tg.setBottomBarColor&&tg.setBottomBarColor('#141416')}catch(e){}
const $=s=>document.querySelector(s),ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={},cur=null,tab='home',tm,D={},live=false,hist=[],hfav=false,lt;
const hdr=()=>({...(tg.initData?{'X-Init':tg.initData}:{}),...(ls('vb_t')?{'X-Token':ls('vb_t')}:{})});
async function api(p,b,raw){const o={headers:{...hdr(),'Content-Type':'application/json'}};if(b!==undefined){o.method='POST';o.body=JSON.stringify(b)}
  const r=await fetch(p,o);if(!r.ok){const e=new Error((await r.text())||r.status);e.status=r.status;throw e}return raw?r:r.json()}
function toast(t,bad){const e=$('#toast');e.textContent=t||'Saved ✓';e.style.background=bad?'var(--red)':'';e.classList.add('on');clearTimeout(lt);lt=setTimeout(()=>e.classList.remove('on'),bad?3800:1400)}
const C=()=>(S.chats||[]).find(c=>c.id==cur);
const TABS=[['home','<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>','Home'],['targets','<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>','Targets'],['voice','<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/><path d="M9 21h6"/></svg>','Voice'],['hist','<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>','History'],['more','<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>','More']];

async function load(keep){
  try{S=await api('/api/state')}catch(e){
    if(e.status==401||e.status==403)return loginView();
    $('#hd').hidden=$('#nv').hidden=true;
    return $('#m').innerHTML='<div class="card center"><div class="big">Could not load the panel</div><div class="mut">Check your connection, then try again.</div><br><button class="btn pri" onclick="load()">Try again</button></div>'}
  if(S.role!=='owner'&&S.role!=='admin')return loginView(S.role=='pending');
  document.body.classList.remove('lg');$('#hd').hidden=$('#nv').hidden=false;
  if(!C())cur=S.chats[0]?.id;
  $('#chat').innerHTML=(S.chats||[]).map(c=>`<option value="${c.id}" ${c.id==cur?'selected':''}>${esc(c.title||c.id)}</option>`).join('');
  render()}
function loginView(pending){document.body.classList.add('lg');$('#hd').hidden=$('#nv').hidden=true;
  $('#m').innerHTML=`<div class="lwrap"><i class="orb o1"></i><i class="orb o2"></i><div class="card login"><div class="lock"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor"/></svg></div><div class="big">Secure Login</div><div class="mut">Admin Control Panel</div>
  ${pending?'<div class="note">Your access is waiting for owner approval.</div>':''}
  <label class="l">Username</label><input type="text" id="lu" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Username">
  <label class="l">Password</label><input type="password" id="lp" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key=='Enter')doLogin()">
  <button class="btn pri" id="lb" onclick="doLogin()">Unlock Panel</button>
  <div class="mut hint">Only approved admins can sign in. Ask the owner if you need access.</div></div></div>`}
async function doLogin(){const b=$('#lb');b.disabled=true;
  try{const r=await api('/api/login',{username:$('#lu').value,password:$('#lp').value});ls('vb_t',r.token);load()}
  catch(e){b.disabled=false;toast((e.message||'Login failed').slice(0,80),1)}}

function render(){
  navSync();
  const c=C();if(!c){$('#m').innerHTML='<div class="center"><div class="big">No groups yet</div><div class="mut">Add the bot to a group and send one message there. The group will then show up here. You must be an admin of that group.</div></div>'+(tab=='more'?V.more():'');return}
  $('#m').innerHTML=V[tab]();if(tab=='hist')loadHist()}
$('#chat').onchange=async e=>{await saveNow();cur=e.target.value;render()};

function set(k,v,re){C().s[k]=v;mark(k);if(re)render()}
function mark(k){(D[cur]=D[cur]||{})[k]=1;sbar(1);clearTimeout(tm);tm=setTimeout(saveNow,700)}
async function saveNow(){clearTimeout(tm);const id=cur,c=C(),ks=Object.keys(D[id]||{});if(!c||!ks.length)return;D[id]={};
  try{await api('/api/save',{chat_id:id,patch:Object.fromEntries(ks.map(k=>[k,c.s[k]]))});sbar(0);toast()}catch(e){ks.forEach(k=>D[id][k]=1);sbar(1);toast('Save failed',1)}}
const ask=(m,f)=>tg.initData&&tg.showConfirm?tg.showConfirm(m,ok=>ok&&f()):confirm(m)&&f();
const tog=(k,l)=>`<div class="row"><span>${l}</span><label class="sw"><input type="checkbox" ${C().s[k]?'checked':''} onchange="set('${k}',this.checked)"><i></i></label></div>`;
const sld=(k,l,a,b,u='')=>`<div style="padding:6px 0"><div class="row" style="padding:0"><span>${l}</span><b id="v_${k}" style="color:var(--ac)">${C().s[k]}${u}</b></div><input type="range" style="--p:${(C().s[k]-a)/(b-a)*100}%" min="${a}" max="${b}" value="${C().s[k]}" oninput="sp(this);$('#v_${k}').textContent=this.value+'${u}'" onchange="set('${k}',+this.value);autoPrev()"></div>`;
const sel=(k,l,o)=>`<div class="row"><span>${l}</span><select style="width:58%" onchange="set('${k}',this.value,${k=='provider'||k=='lang'});autoPrev()">${o.map(([v,t])=>`<option value="${esc(v)}" ${C().s[k]==v?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
const inUse=v=>{const s=C().s,pv=s.provider=='both'?(s['cartesia_voice_'+v.lang]?'cartesia':'elevenlabs'):s.provider;
  return pv==v.prov&&s[v.prov+'_voice_'+v.lang]==v.id&&(s.lang=='auto'||s.lang==v.lang)};
const vname=v=>v.split('-').slice(2).join(' ').replace('Neural','')+' ('+v.slice(0,5)+')';

const SHORT={quota:'Out of credits',plan:'Plan blocks voice',auth:'Key rejected',rate:'Rate limited',voice:'Voice ID problem',server:'Unreachable',other:'Error',config:'Not set'};
const FIX={plan:'Free plan cannot use Voice Library voices via API. Use a Default voice (e.g. Sarah), add $5 credits, or use Edge TTS.',quota:'Credits or monthly quota used up. Add credits, or switch provider in Voice > Provider.',auth:'The API key was rejected. Check the key in your server settings.',rate:'Too many requests right now. This usually clears by itself.',voice:'The voice ID was not accepted. Check it in Voice > Voice library.',server:'The service is unreachable right now. It usually recovers by itself.',other:'The last request failed.'};
const PN={cartesia:'Cartesia',elevenlabs:'ElevenLabs'};

const alerts=()=>['cartesia','elevenlabs'].filter(bad).map(p=>`<div class="card s4 alert"><b>${PN[p]}: ${SHORT[S.status[p].kind]||'Error'}</b><div>${FIX[S.status[p].kind]||FIX.other}</div></div>`).join('');

const V={
home(){const c=C(),st=c.stats,mx=Math.max(1,...st.daily.map(d=>d[1])),tp=Object.values(st.prov).reduce((a,b)=>a+b,0)||1;
 return `<div class="bento">${alerts()}

 <button class="btn s4" style="width:100%" onclick="load()">↻ Refresh</button>`},

 ${tog('only_listed','Only reply to listed users')}${sld('default_timer','Wait before sending',1,120,'s')}</div>

function graph(st){const d=st.daily||[],W=320,H=110,L=8,R=8,T=14,B=22;if(!d.length)return `<div class="card s4"><div class="act"><h4>Bot activity</h4><span class="live"><i></i>Live</span></div><div class="mut" style="padding:26px 0;text-align:center">No activity yet. Voices will appear here.</div></div>`;

  let p=`M${X(0)},${Y(v[0])}`;for(let i=1;i<n;i++){const cx=(X(i-1)+X(i))/2;p+=` C${cx},${Y(v[i-1])} ${cx},${Y(v[i])} ${X(i)},${Y(v[i])}`}
  const a=p+` L${X(n-1)},${H-B} L${X(0)},${H-B} Z`,tot=v.reduce((a,b)=>a+b,0),pk=Math.max(...v),td=new Date().toISOString().slice(0,10),today=d.filter(x=>x[0]==td).reduce((a,b)=>a+b[1],0);

  ${[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${T+(H-T-B)*f}" y2="${T+(H-T-B)*f}" stroke="var(--line)" stroke-width=".6"/>`).join('')}
  <path class="ar" d="${a}"/><path class="ln" pathLength="1" d="${p}"/>${v.map((y,i)=>`<circle class="dt" cx="${X(i)}" cy="${Y(y)}" r="2.6"/>`).join('')}<circle class="hl" cx="${X(n-1)}" cy="${Y(v[n-1])}" r="4"/>
  ${d.map((x,i)=>`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${x[0].slice(8)}</text>`).join('')}</svg>
  <div class="gs"><div><b>${today}</b><span>Today</span></div><div><b>${tot}</b><span>${n}-day total</span></div><div><b>${pk}</b><span>Peak day</span></div><div><b>${(tot/n).toFixed(1)}</b><span>Daily avg</span></div></div></div>`}
