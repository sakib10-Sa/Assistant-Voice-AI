input:focus,textarea:focus,select:focus{outline:0;box-shadow:var(--glow)}
.sw i,.sw i:after{transition:background .25s var(--ease),transform .25s var(--ease)}
.pb b,.bars b{transition:width .5s var(--ease),height .5s var(--ease)}
.item{transition:background .2s}
